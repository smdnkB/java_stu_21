spring:
  application:
    name: service01
  cloud:
    nacos:
      username: nacos # 开启认证需要账号密码
      password: nacos # 开启认证需要账号密码
      config:
        server-addr: 192.168.0.8:8848
        file-extension: yaml # 默认使用配置中心的文件名：${prefix}-${spring.profiles.active}.${file-extension}
